<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Calculadora Avançada</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--panel2:#18263a;--line:#29394f;--muted:#91a2b9;--text:#edf4ff;--accent:#70a5ff;--accent2:#9ac1ff;--danger:#ff9a9a;--shadow:0 24px 70px #0007}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#1e3b66 0%,transparent 65%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
.app{width:min(100%,490px);background:linear-gradient(180deg,#152237,#101a2a);border:1px solid #2a3c55;border-radius:25px;padding:23px;box-shadow:var(--shadow)}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7db0ff,#416ed0);display:grid;place-items:center;color:#071326;font-size:22px;font-weight:800}.brand h1{font-size:17px;margin:0;letter-spacing:.2px}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.precision{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:10px;white-space:nowrap}
.screen{background:#091321;border:1px solid #26374e;border-radius:17px;padding:16px 17px 15px;min-height:135px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:15px}.screen-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#7489a5}.expression{width:100%;border:0;outline:0;background:transparent;color:#b6c6dc;text-align:right;font-size:18px;padding:10px 0 7px;font-family:inherit}.result{font-size:clamp(25px,6vw,34px);line-height:1.25;text-align:right;font-weight:650;overflow-wrap:anywhere;min-height:43px;letter-spacing:-.8px}.result.error{font-size:14px;color:var(--danger);font-weight:500;letter-spacing:0}
.advanced-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:9px}.advanced-keys .key{min-height:46px;font-size:15px}.advanced-keys .key.wide{font-size:13px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.key{min-height:57px;border:1px solid #2b3d54;background:#1b2a40;color:#e7effb;border-radius:13px;font-size:19px;font-weight:550;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;user-select:none}.key:hover{background:#263a55;border-color:#466184}.key:active{transform:scale(.96)}.key.function{background:#172438;color:#a9c3e9}.key.operator{background:#203958;color:#a9ccff;border-color:#34547a}.key.equals{background:linear-gradient(135deg,#75adff,#4f7fe0);color:#08172c;border:0;font-size:23px}.key.clear{color:#ffb6b6;background:#362631;border-color:#593943}.key.zero{grid-column:span 2}.foot{display:flex;justify-content:space-between;gap:10px;color:#7488a3;font-size:10px;margin-top:15px}.history{margin-top:14px;border-top:1px solid #29394f;padding-top:12px}.history-head{display:flex;align-items:center;justify-content:space-between;color:#91a2b9;font-size:11px}.history-head button{background:none;border:0;color:#8fb8ff;cursor:pointer;font-size:11px}.history-list{display:flex;flex-direction:column;gap:7px;max-height:108px;overflow:auto;margin-top:9px}.history-item{display:flex;justify-content:space-between;gap:12px;color:#aabbd2;font-size:12px;cursor:pointer;padding:5px 7px;border-radius:7px}.history-item:hover{background:#1d2d43}.history-item strong{color:#edf4ff;font-weight:600}.hint{color:#6f829d;font-size:10px;margin-top:9px;text-align:center}
@media(max-width:420px){body{padding:12px}.app{padding:16px;border-radius:20px}.key{min-height:53px}.keys{gap:7px}.precision{font-size:9px;padding:6px 8px}}
</style>
</head>
<body>
<main class="app" aria-label="Calculadora avançada">
  <header class="header"><div class="brand"><div class="logo">÷</div><div><h1>Calculadora Avançada</h1><p>Precisão decimal e números grandes</p></div></div><span class="precision">20 casas decimais</span></header>
  <section class="screen" aria-live="polite"><div class="screen-label">Expressão</div><input id="expression" class="expression" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="Digite uma expressão…" aria-label="Expressão matemática"><div id="result" class="result">0</div></section>
  <section class="advanced-keys" aria-label="Potências e raízes">
    <button class="key function" data-insert="^2" title="Elevar ao quadrado">x²</button>
    <button class="key function" data-insert="^" title="Potência com expoente livre">xʸ</button>
    <button class="key function" data-insert="√(" title="Raiz quadrada">√</button>
    <button class="key function" data-insert="∛(" title="Raiz cúbica">∛</button>
    <button class="key function" data-insert="root(" title="Raiz de índice n">ⁿ√</button>
    <button class="key function" data-insert="exp(" title="Função exponencial e elevado a x">eˣ</button>
    <button class="key function" data-insert="ln(" title="Logaritmo natural">ln</button>
    <button class="key function" data-insert="log(" title="Logaritmo na base 10">log</button>
    <button class="key function wide" data-insert="log(" title="Logaritmo de base personalizada: log(base;valor)">logₐ</button>
  </section>
  <section class="keys" aria-label="Teclado da calculadora">
    <button class="key clear" data-action="clear">AC</button><button class="key function" data-action="back">⌫</button><button class="key function" data-value="(">(</button><button class="key operator" data-value="÷">÷</button>
    <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key operator" data-value="×">×</button>
    <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key operator" data-value="−">−</button>
    <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key operator" data-value="+">+</button>
    <button class="key zero" data-value="0">0</button><button class="key" data-value=",">,</button><button class="key function" data-value=")">)</button>
    <button class="key function" data-action="sign">±</button><button class="key function" data-action="clearentry">CE</button><button class="key equals" data-action="equals" style="grid-column:span 2">=</button>
  </section>
  <div class="foot"><span>Enter: calcular</span><span>log(2;8) = 3</span><span>eˣ = exp(x)</span></div>
  <section class="history"><div class="history-head"><span>Histórico recente</span><button id="clearHistory" type="button">Limpar histórico</button></div><div id="history" class="history-list"><div class="hint">Seus cálculos aparecerão aqui.</div></div></section>
</main>
<script>
(() => {
  'use strict';
  const input = document.getElementById('expression');
  const resultEl = document.getElementById('result');
  const historyEl = document.getElementById('history');
  const MAX_INPUT = 2000, MAX_DIGITS = 10000, MAX_DEPTH = 100, DIVISION_SCALE = 20;
  let justEvaluated = false;
  const pow10Cache = [1n];
  function pow10(n){ if(!Number.isInteger(n)||n<0||n>MAX_DIGITS) throw new Error('Número com escala excessivamente grande.'); while(pow10Cache.length<=n) pow10Cache.push(pow10Cache[pow10Cache.length-1]*10n); return pow10Cache[n]; }
  function make(n,s=0){ if(s<0||s>MAX_DIGITS) throw new Error('Precisão numérica excedida.'); if(n===0n) return {n:0n,s:0}; while(s>0 && n%10n===0n){n/=10n;s--;} if(n.toString().replace('-','').length>MAX_DIGITS) throw new Error('Número com dígitos demais.'); return {n,s}; }
  function parseDecimal(text){ const t=text.replace(',','.'); if(!/^\d+(?:\.\d*)?$|^\.\d+$/.test(t)) throw new Error('Número inválido.'); const [whole,frac='']=t.split('.'); if(whole.length+frac.length>MAX_DIGITS) throw new Error('Número com dígitos demais.'); return make(BigInt((whole||'0')+frac),frac.length); }
  function add(a,b){const s=Math.max(a.s,b.s);return make(a.n*pow10(s-a.s)+b.n*pow10(s-b.s),s)}
  function neg(a){return {n:-a.n,s:a.s}}
  function sub(a,b){return add(a,neg(b))}
  function mul(a,b){return make(a.n*b.n,a.s+b.s)}
  function div(a,b){ if(b.n===0n) throw new Error('Não é possível dividir por zero.'); const numerator=a.n*pow10(b.s+DIVISION_SCALE); const denominator=b.n*pow10(a.s); let q=numerator/denominator; const r=numerator%denominator; const ar=r<0n?-r:r, ad=denominator<0n?-denominator:denominator; const twice=2n*ar; if(twice>ad || (twice===ad && (q<0n?-q:q)%2n===1n)) q += (numerator<0n)!==(denominator<0n)?-1n:1n; return make(q,DIVISION_SCALE); }
  function format(a){ if(a.n===0n)return '0'; const negative=a.n<0n; let digits=(negative?-a.n:a.n).toString(); if(a.s){digits=digits.padStart(a.s+1,'0');digits=digits.slice(0,-a.s)+','+digits.slice(-a.s);} return (negative?'-':'')+digits; }
  const FIXED_SCALE = 70;
  const FIXED_ONE = pow10(FIXED_SCALE);
  function fixedMul(a,b){return a*b/FIXED_ONE;}
  function fixedDiv(a,b){if(b===0n)throw new Error('Divisão interna por zero.');return a*FIXED_ONE/b;}
  function absBigInt(v){return v<0n?-v:v;}
  function roundRatio(numerator,denominator){
    if(denominator===0n)throw new Error('Divisão interna por zero.');
    const negative=(numerator<0n)!==(denominator<0n);
    const n=absBigInt(numerator),d=absBigInt(denominator);
    let q=n/d;const r=n%d;const twice=2n*r;
    if(twice>d||(twice===d&&q%2n===1n))q++;
    return negative?-q:q;
  }
  function decimalToFixed(value){
    const shift=FIXED_SCALE-value.s;
    return shift>=0?value.n*pow10(shift):value.n/pow10(-shift);
  }
  function fixedToDecimal(value){
    const divisor=pow10(FIXED_SCALE-DIVISION_SCALE);
    return make(roundRatio(value,divisor),DIVISION_SCALE);
  }
  function lnAtanh(x){
    const z=fixedDiv(x-FIXED_ONE,x+FIXED_ONE);
    const z2=fixedMul(z,z);
    let term=z,sum=z;
    for(let denominator=3n;denominator<=2001n;denominator+=2n){
      term=fixedMul(term,z2);
      const contribution=term/denominator;
      if(contribution===0n)break;
      sum+=contribution;
    }
    return 2n*sum;
  }
  const LN2_FIXED=lnAtanh(2n*FIXED_ONE);
  function lnPositiveFixed(value){
    if(value<=0n)throw new Error('O logaritmo exige um número positivo.');
    let reduced=value,twos=0n;
    while(reduced>3n*FIXED_ONE/2n){reduced/=2n;twos++;}
    while(reduced<3n*FIXED_ONE/4n){reduced*=2n;twos--;}
    return lnAtanh(reduced)+twos*LN2_FIXED;
  }
  const LN10_FIXED=lnPositiveFixed(10n*FIXED_ONE);
  function naturalLog(value){
    if(value.n<=0n)throw new Error('O logaritmo exige um número positivo.');
    const digits=absBigInt(value.n).toString().length;
    const decimalExponent=BigInt(digits-1-value.s);
    const mantissa=absBigInt(value.n)*FIXED_ONE/pow10(digits-1);
    return lnPositiveFixed(mantissa)+decimalExponent*LN10_FIXED;
  }
  function logarithm(value,base=null){
    const lnValue=naturalLog(value);
    if(base===null)return fixedToDecimal(fixedDiv(lnValue,LN10_FIXED));
    if(base.n<=0n)throw new Error('A base do logaritmo deve ser positiva.');
    if(base.n===pow10(base.s))throw new Error('A base do logaritmo não pode ser 1.');
    const lnBase=naturalLog(base);
    if(lnBase===0n)throw new Error('A base está próxima demais de 1 para a precisão disponível.');
    return fixedToDecimal(fixedDiv(lnValue,lnBase));
  }
  function exponential(value){
    const x=decimalToFixed(value);
    const k=roundRatio(x,LN2_FIXED);
    if(k>33000n)throw new Error('Resultado da exponencial grande demais para exibir.');
    if(k< -500n)return make(0n,0);
    const remainder=x-k*LN2_FIXED;
    let term=FIXED_ONE,sum=FIXED_ONE;
    for(let i=1n;i<=500n;i++){
      term=fixedMul(term,remainder)/i;
      if(term===0n)break;
      sum+=term;
    }
    const scaled=k>=0n?sum*(1n<<k):sum/(1n<<(-k));
    return fixedToDecimal(scaled);
  }
  function tokenize(src){
    if(src.length>MAX_INPUT) throw new Error('Expressão muito longa (limite de 2.000 caracteres).');
    const s=src.replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/,/g,'.');
    const tokens=[];let i=0;
    while(i<s.length){
      const c=s[i];
      if(/\s/.test(c)){i++;continue;}
      if(/[0-9.]/.test(c)){
        const start=i;let dots=0;
        while(i<s.length&&/[0-9.]/.test(s[i])){if(s[i]==='.')dots++;i++;}
        if(dots>1||s.slice(start,i)==='.')throw new Error('Número decimal inválido.');
        tokens.push({type:'num',value:s.slice(start,i)});continue;
      }
      let matched=false;
      for(const [word,type] of [['root','root'],['log','log'],['ln','ln'],['exp','exp']]){
        if(s.startsWith(word,i)&&!/[A-Za-z]/.test(s[i+word.length]||'')){
          tokens.push({type});i+=word.length;matched=true;break;
        }
      }
      if(matched)continue;
      if(s.startsWith('√',i)){tokens.push({type:'sqrt'});i++;continue;}
      if(s.startsWith('∛',i)){tokens.push({type:'cbrt'});i++;continue;}
      if('+-*/^();'.includes(c)){tokens.push({type:c,value:c});i++;continue;}
      throw new Error('Caractere não permitido: '+c);
    }
    tokens.push({type:'eof'});return tokens;
  }
  function evaluate(source){
    const tokens=tokenize(source);let pos=0,depth=0;
    const peek=()=>tokens[pos],take=()=>tokens[pos++];
    function primary(){
      if(peek().type==='num')return parseDecimal(take().value);
      if(peek().type==='('){
        take();if(++depth>MAX_DEPTH)throw new Error('Parênteses aninhados demais.');
        const v=expression();
        if(peek().type!==')')throw new Error('Parênteses desbalanceados: falta “)”.');
        take();depth--;return v;
      }
      if(peek().type==='sqrt'){take();return nthRoot(primary(),2);}
      if(peek().type==='cbrt'){take();return nthRoot(primary(),3);}
      if(peek().type==='root'){
        take();
        if(peek().type!=='(')throw new Error('Use a sintaxe root(índice; radicando).');
        take();
        const indexValue=expression();
        if(peek().type!==';')throw new Error('Separe o índice e o radicando com ponto e vírgula: root(3;27).');
        take();
        const radicand=expression();
        if(peek().type!==')')throw new Error('Falta fechar os parênteses da função root.');
        take();
        if(indexValue.s!==0||indexValue.n<2n||indexValue.n>100n)throw new Error('O índice da raiz deve ser um inteiro entre 2 e 100.');
        return nthRoot(radicand,Number(indexValue.n));
      }
      if(peek().type==='ln'||peek().type==='exp'){
        const fn=take().type;
        if(peek().type!=='(')throw new Error('Use '+fn+'(valor).');
        take();const argument=expression();
        if(peek().type!==')')throw new Error('Falta fechar os parênteses da função '+fn+'.');
        take();
        return fn==='ln'?fixedToDecimal(naturalLog(argument)):exponential(argument);
      }
      if(peek().type==='log'){
        take();
        if(peek().type!=='(')throw new Error('Use log(valor) ou log(base; valor).');
        take();
        const first=expression();
        if(peek().type===';'){
          take();const second=expression();
          if(peek().type!==')')throw new Error('Falta fechar os parênteses de log(base; valor).');
          take();return logarithm(second,first);
        }
        if(peek().type!==')')throw new Error('Use log(valor) ou log(base; valor).');
        take();return logarithm(first);
      }
      throw new Error('Era esperado um número, uma função matemática ou “(”.');
    }
    function powerExpr(){
      const base=primary();
      if(peek().type==='^'){take();const exponent=unary();return raisePower(base,exponent);}
      return base;
    }
    function unary(){
      if(peek().type==='+'){take();return unary();}
      if(peek().type==='-'){take();return neg(unary());}
      return powerExpr();
    }
    function term(){
      let v=unary();
      while(peek().type==='*'||peek().type==='/'){
        const op=take().type,b=unary();v=op==='*'?mul(v,b):div(v,b);
      }
      return v;
    }
    function expression(){
      let v=term();
      while(peek().type==='+'||peek().type==='-'){
        const op=take().type,b=term();v=op==='+'?add(v,b):sub(v,b);
      }
      return v;
    }
    if(peek().type==='eof')throw new Error('Digite uma expressão para calcular.');
    const value=expression();
    if(peek().type!=='eof'){
      if(peek().type===')')throw new Error('Parêntese “)” sem abertura correspondente.');
      if(peek().type===';')throw new Error('Ponto e vírgula só pode ser usado dentro de root(índice; radicando) ou log(base; valor).');
      throw new Error('Expressão incompleta ou operador em posição inválida.');
    }
    return value;
  }
  function showError(msg){resultEl.textContent=msg;resultEl.classList.add('error');}
  function showResult(text){resultEl.textContent=text;resultEl.classList.remove('error');}
  function calculate(){const src=input.value.trim();try{const value=evaluate(src);const formatted=format(value);showResult(formatted);addHistory(src,formatted);justEvaluated=true;return true;}catch(e){showError(e.message||'Não foi possível calcular a expressão.');justEvaluated=false;return false;}}
  const records=[];
  function addHistory(expr,value){if(records[0]&&records[0].expr===expr&&records[0].value===value)return;records.unshift({expr,value});if(records.length>8)records.pop();renderHistory();}
  function renderHistory(){historyEl.innerHTML='';if(!records.length){historyEl.innerHTML='<div class="hint">Seus cálculos aparecerão aqui.</div>';return;}for(const r of records){const row=document.createElement('div');row.className='history-item';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=r.expr;b.textContent=r.value;row.append(a,b);row.title='Clique para reutilizar';row.addEventListener('click',()=>{input.value=r.expr;input.focus();justEvaluated=false;});historyEl.append(row);}}
  function insert(v){if(justEvaluated&&/[0-9.(√∛r]/.test(v))input.value='';justEvaluated=false;const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.setRangeText(v,start,end,'end');input.focus();preview();}
  function preview(){if(!input.value.trim()){showResult('0');return;}try{showResult(format(evaluate(input.value)));}catch(e){if(/zero/.test(e.message))showError(e.message);else {resultEl.classList.remove('error');resultEl.textContent='';}}}
  document.querySelectorAll('.keys,.advanced-keys').forEach(panel=>panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.insert!==undefined){insert(b.dataset.insert);return;}if(b.dataset.value!==undefined){insert(b.dataset.value);return;}switch(b.dataset.action){case'clear':input.value='';justEvaluated=false;showResult('0');input.focus();break;case'back':{const s=input.selectionStart??input.value.length,en=input.selectionEnd??s;if(s===en&&s>0)input.setRangeText('',s-1,s,'end');else input.setRangeText('',s,en,'end');justEvaluated=false;input.focus();preview();break;}case'equals':calculate();input.focus();break;case'clearentry':{const m=input.value.match(/(\d+(?:[.,]\d*)?|[.,]\d+)\s*$/);if(m)input.value=input.value.slice(0,m.index);else input.value='';justEvaluated=false;preview();input.focus();break;}case'sign':{const s=input.selectionStart??input.value.length;const left=input.value.slice(0,s);const m=left.match(/(\d+(?:[.,]\d*)?|[.,]\d+)\s*$/);if(m){const start=m.index;const before=input.value.slice(0,start);const token=m[0].trim();if(before.endsWith('-')&&(before.length===1||/[+*/(]/.test(before.at(-2))))input.value=before.slice(0,-1)+token+input.value.slice(s);else input.value=before+'-'+token+input.value.slice(s);}else input.value='-'+input.value;justEvaluated=false;preview();input.focus();break;}}}));
  input.addEventListener('input',()=>{justEvaluated=false;preview();});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();calculate();}if(e.key==='Escape'){input.value='';showResult('0');justEvaluated=false;}});
  document.getElementById('clearHistory').addEventListener('click',()=>{records.length=0;renderHistory();});
  showResult('0');
})();
</script>
</body>
</html>
